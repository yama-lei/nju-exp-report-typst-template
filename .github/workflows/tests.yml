name: Compile and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.14.2'
      - name: Install open-source fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-texgyre fonts-dejavu-core fonts-liberation
      - name: Test isolated package installation and compilation
        run: python3 -m unittest discover -s tests -v
      - name: Compile manual and initialized template
        run: |
          mkdir -p build
          typst compile --root . docs/manual.typ build/manual.pdf
          bash scripts/package build/packages/local
          typst init --package-path build/packages @local/nju-exp-report:0.1.0 build/report
          typst compile --package-path build/packages build/report/main.typ build/report.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-examples
          path: build/*.pdf
