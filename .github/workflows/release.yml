name: Package and release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.14.2'
      - name: Install open-source fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-texgyre fonts-dejavu-core fonts-liberation
      - name: Check version and test
        run: |
          . scripts/setup
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "PKG_NAME=$PKG_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 -m unittest discover -s tests -v
      - name: Build release archive
        run: |
          bash scripts/package out
          mkdir -p dist
          tar -czf "dist/$PKG_NAME-$PKG_VERSION.tar.gz" -C out "$PKG_NAME"
          typst compile --root . docs/manual.typ dist/manual.pdf
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$PKG_NAME $PKG_VERSION" \
            --generate-notes
